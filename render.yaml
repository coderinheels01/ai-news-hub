databases:
  - name: ai-news-hub-db
    databaseName: ai_news_hub
    user: ainewshub
    plan: free

services:
  - type: cron
    name: daily-digest-job
    env: docker
    dockerfilePath: ./Dockerfile
    schedule: "25 9 * * *"
    dockerCommand: python main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-hub-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: MY_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false

